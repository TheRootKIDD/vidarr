# local_3060 — the project's own rig, every value measured (docs/06 §6, ADR-015).
#
# Each number carries a `source` naming the experiments/<id> that produced it, so
# a simulator result can be traced to a measurement. `status: placeholder` marks
# the values still waiting on a bench; nothing here is a vendor spec unless it
# says so. Units are SI bytes and seconds unless the key says otherwise.

name: local_3060
description: 4 x RTX 3060 12 GB (3 x GA104, 1 x GA106; sm_86, 28 SMs each), TR PRO 3945WX, 128 GB DDR4, no NVLink, no P2P
date: 2026-09-02

unit:
  U: 1                      # chips per unit; the rig is 4 units of U=1 (docs/06 §2)
  n_units: 4
  source: docs/06 §2, ADR-015

chip:
  phi_flops: 27.1e12
  phi_note: peak achieved BF16 (FP32 accumulate) over the expert-step grid; nominal was 25.5e12
  phi_per_card: [27.10e12, 26.44e12, 26.91e12, 26.91e12]
  phi_source: experiments/003-gemm (derived[].phi_tflops)

  beta_c_bytes_per_s: 342e9
  beta_c_note: read-only sweep of 1 GiB; on-device copy traffic 333e9; nominal 360e9
  beta_c_source: experiments/011-tiers-mem (vram.read_only_GBps_1GiB)

  m_c_bytes: 12.49e9        # 11.63 GiB usable as reported by torch
  m_c_source: experiments/000-env

  ridge_flop_per_byte: 79   # phi / beta_c
  ridge_source: derived from 003-gemm and 011-tiers-mem

  s_min: 256
  s_min_note: smallest d_ff slice reaching >= 80% of phi; docs/06 §1 expected 128-256
  s_min_source: experiments/003-gemm (derived[].s_min)

  b_min_roofline_bf16: 79   # (phi / beta_c) * (b_w / 2), docs/02 §2
  b_min_roofline_source: derived from 003-gemm and 011-tiers-mem
  b_floor_empirical: 512
  b_floor_note: >
    smallest batch reaching >= 80% of phi at d_ff >= 2048. This is an occupancy
    floor, 7x the roofline b_min; the per-expert queue must use the larger.
  b_floor_source: experiments/003-gemm (derived[].b_floor_empirical)

  grouped_gemm:
    efficiency_vs_dense_by_tokens_per_expert: {4096: 1.02, 2048: 1.02, 1024: 1.02, 512: 1.02, 256: 1.01, 128: 0.98, 64: 0.67}
    note: no MoE dispatch penalty at >= 128 tokens per expert; cliff below
    source: experiments/003-gemm (grouped[])

  odd_width_penalty:
    note: odd d_ff costs 12-27% throughput; round derived widths to a multiple of 64
    source: experiments/004-gemm-alignment

  sparsity_2_4:
    speedup_best: 1.58
    speedup_best_shape: {d: 1024, d_ff: 1664, b: 32768}
    break_even_batch: 2048-4096
    effective_tflops_ceiling: 40e12   # nominal "51 with 2:4" is not reached
    note: a loss below b~2048-4096; plateaus at 1.3-1.6x, not 2x; worse for wider experts
    source: experiments/005-sparse24, experiments/006-sparse24-large

fabric:
  kind: host-bounced PCIe 4.0 x16 (NCCL_P2P_DISABLE=1; no NVLink, no P2P on GeForce)
  lambda_link_bytes_per_s: 3.59e9
  lambda_link_note: bytes on the wire per rank per second, agreed within 2% by all-reduce, all-gather and all-to-all
  lambda_link_source: experiments/002-nccl
  latency_floor_s: 44e-6
  latency_floor_source: experiments/002-nccl (median @ 1 KiB across the three collectives)
  half_bandwidth_message_bytes: 262144   # 256-512 KiB reaches half the plateau
  half_bandwidth_source: experiments/002-nccl
  busbw_plateau_bytes_per_s:
    all_reduce: 3.59e9
    all_gather: 0.89e9   # nccl-tests convention; 3.54e9 bytes on wire
    all_to_all: 3.60e9
  busbw_source: experiments/002-nccl
  pair_d2d_through_host_bytes_per_s: 11.6e9
  pair_d2d_note: one pair, one direction, uncontended; 4-way collectives share the root complex and land at lambda_link
  pair_d2d_source: experiments/011-tiers-mem (d2d[])
  # lambda_c (unit-local fabric) is not a separate quantity here: U=1, so the
  # "unit-internal" ring of docs/02 §2 IS the host-bounced link above. S10 uses
  # lambda_link as lambda_c when it stripes one expert across the four cards.
  lambda_c_bytes_per_s: 3.59e9
  lambda_c_source: same as lambda_link (U=1 rig; see note)

tiers:
  hot:
    bandwidth_bytes_per_s: 342e9
    source: experiments/011-tiers-mem
  warm:
    medium: host DDR4 over PCIe, pinned
    h2d_bytes_per_s: 24.3e9
    d2h_bytes_per_s: 27.1e9
    pageable_h2d_bytes_per_s: 14.8e9
    pageable_d2h_bytes_per_s: 9.0e9
    latency_4kib_s: 5e-6           # 4 KiB blocks run at 0.5-0.9 GB/s => 5-9 us per call
    batch_knee_bytes: 65536        # fetches below ~64 KiB see < 1/4 of the link
    note: G entry at small = 1 KiB, B_idx=16 block = 16 KiB; batch several blocks per fetch
    source: experiments/011-tiers-mem (host[])
  cold:
    medium: NVMe (4 TB, pending install — I10)
    bandwidth_bytes_per_s: null
    random_latency_s: null
    status: placeholder
    note: measure with bench_tiers --tiers storage on the NVMe once installed; do NOT use the SATA SSD
    source: pending

host:
  cpu: AMD Ryzen Threadripper PRO 3945WX, 12C/24T
  ram_bytes: 134e9
  ann_cpu:
    index: IVF4000,PQ96x8 over 1 M x 768-d
    qps_batched_nprobe_8: 7224
    qps_batched_nprobe_1: 27490
    single_query_latency_nprobe_8_s: 1.35e-3
    build_s_1m: 53.2
    recall_note: degenerate on random vectors; re-measure on real sentence embeddings (I8/I9)
    source: experiments/007-faiss-1m
  source: experiments/000-env

training_throughput:
  small_dense:
    tokens_per_s_1gpu: 22117
    tflops_per_gpu_1gpu: 12.52         # non-embedding accounting; 15.78 incl. output head
    tokens_per_s_4gpu_ddp_no_accum: 67466
    tflops_per_gpu_4gpu_ddp: 9.55      # 12.04 incl. head
    ddp_overhead_per_microstep: 0.31   # amortises to ~2% at 0.5 M-token batches
    peak_mem_bytes_mb4: 8.58e9         # micro-batch 4 x 2048; 8 x 2048 does not fit
    source: experiments/009-train-step, experiments/010-train-step-ddp
  small_recurrent:
    tokens_per_s: null
    status: placeholder
    note: waits for model/ (Phase 1); docs/06 §4's 5 TFLOPS assumption not yet replaced
    source: pending

provenance:
  driver: "595.80"
  cuda_runtime: "13.2"
  torch: "2.13.0+cu130"
  python: "3.12.13"
  nccl: "2.29.7"
  faiss: "1.15.0"
  source: experiments/000-env, experiments/002-nccl, experiments/007-faiss-1m
